# XcodeGen spec - generate the Xcode project with:  xcodegen generate
name: PortalAlley
options:
  bundleIdPrefix: dev.portalalley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PortalCore:
    path: PortalCore

targets:
  PortalAlley:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Shaders
      - path: App/Resources/Portal
        type: folder          # copied as a folder reference -> Bundle/Portal/...
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: PortalCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Portal
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "6"
        NSCameraUsageDescription: The camera shows your room so the doorway can be placed in it.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.portalalley.PortalAlley
        PRODUCT_NAME: PortalAlley
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MTL_FAST_MATH: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  PortalAlley:
    build:
      targets:
        PortalAlley: all
    run:
      config: Debug
    archive:
      config: Release



